<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerodrome Trainer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta property="og:title" content="Aerodrome Trainer" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="thumbnail.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="thumbnail.jpg" />
    <style>
      :root {
        --bg: #0b1016;
        --panel: #121923;
        --panel2: #18212d;
        --line: #243040;
        --fg: #e6edf5;
        --mut: #8a9bb0;
        --acc: #4cc9f0;
        --acc2: #7c5cff;
        --ok: #34d399;
        --bad: #fb7185;
        --warn: #fbbf24;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        height: 100dvh;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.4 Inter,
          system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      svg#map:focus-visible {
        outline-offset: -3px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .skip {
        position: absolute;
        left: 8px;
        top: -50px;
        z-index: 100;
        background: var(--acc);
        color: #04121a;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 700;
      }
      .skip:focus {
        top: 8px;
      }
      header {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .hdr-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .hdr-left .btn,
      .hdr-left select {
        flex: none;
      }
      .hdr-right {
        display: flex;
        justify-content: flex-end;
        min-width: 120px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin-right: 8px;
        white-space: nowrap;
      }
      .brand i {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--acc), var(--acc2));
        display: grid;
        place-items: center;
        font-style: normal;
        color: #04121a;
      }
      .tabs {
        justify-self: center;
        display: flex;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 3px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 7px 18px;
        border-radius: 9px;
        cursor: pointer;
        color: var(--mut);
        font-weight: 600;
      }
      .tabs button:hover:not(.on) {
        color: var(--fg);
        background: var(--panel2);
      }
      .tabs button.on:hover {
        filter: brightness(1.1);
      }
      .tabs button.on {
        background: linear-gradient(135deg, var(--acc), var(--acc2));
        color: #05111a;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--c, var(--mut));
        white-space: nowrap;
      }
      .pill:empty {
        display: none;
      }
      .pill i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c, var(--mut));
        box-shadow: 0 0 8px var(--c, transparent);
      }
      .pill b {
        font-weight: 600;
      }
      .btn,
      select {
        height: 34px;
      }
      .btn {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        transition: 0.15s;
        color: var(--fg);
      }
      .btn:hover:not(:disabled) {
        border-color: var(--acc);
        background: #1d2836;
      }
      .btn.icon {
        width: 34px;
        padding: 0;
        color: var(--mut);
      }
      .btn.icon:hover:not(:disabled) {
        color: var(--acc);
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--acc), var(--acc2));
        color: #05111a;
        border: 0;
        font-weight: 700;
        padding: 0 16px;
      }
      .btn.primary:hover:not(:disabled) {
        background: linear-gradient(135deg, var(--acc), var(--acc2));
        filter: brightness(1.15);
      }
      .btn.solid:hover:not(:disabled) {
        background: var(--bad);
        filter: brightness(1.12);
      }
      .btn.danger {
        color: var(--mut);
      }
      .btn.danger:hover:not(:disabled) {
        color: var(--bad);
        border-color: var(--bad);
        background: #2a1620;
      }
      .btn.solid {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
        padding: 0 16px;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        filter: grayscale(1);
      }
      .btn.primary:disabled {
        background: var(--panel2);
        color: var(--mut);
        border: 1px solid var(--line);
      }
      .ic {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #tools {
        width: 72px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 8px;
      }
      #tools button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 2px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: none;
        cursor: pointer;
        color: var(--mut);
        font-size: 10.5px;
      }
      #tools button svg {
        width: 24px;
        height: 24px;
      }
      #tools button:hover:not(.on) {
        background: var(--panel2);
        color: var(--fg);
        border-color: var(--line);
      }
      #tools button.on {
        background: var(--panel2);
        border-color: var(--acc);
        color: var(--acc);
      }
      #tools kbd {
        position: absolute;
        top: 3px;
        right: 4px;
        font: 600 9px/1 system-ui;
        color: var(--mut);
        opacity: 0.8;
      }
      #tools hr {
        width: 100%;
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      #stage {
        flex: 1;
        position: relative;
        min-width: 0;
        background: radial-gradient(circle at 50% 40%, #101a26, #0a0f15);
      }
      svg#map {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        max-width: calc(100% - 100px);
        background: #0d141cdd;
        backdrop-filter: blur(6px);
        border: 1px solid var(--line);
        padding: 6px 14px;
        border-radius: 999px;
        color: var(--mut);
        font-size: 12.5px;
        pointer-events: none;
        text-align: center;
      }
      #hint:empty {
        display: none;
      }
      #draftbar {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        align-items: center;
        background: #0d141cf2;
        backdrop-filter: blur(6px);
        border: 1px solid #4cc9f066;
        border-radius: 14px;
        padding: 5px 5px 5px 12px;
        box-shadow: 0 8px 28px #0009;
        white-space: nowrap;
      }
      #draftbar .btn {
        flex: none;
        height: 30px;
        padding: 0 10px;
        font-size: 12.5px;
        gap: 7px;
      }
      #draftbar .btn.primary {
        padding: 0 12px;
      }
      #draftbar .btn kbd.k {
        background: #0003;
        border-color: #ffffff22;
        color: inherit;
        opacity: 0.8;
      }
      #draftbar .btn.primary kbd.k {
        border-color: #0004;
        color: #05111a;
      }
      #draftbar .cnt {
        padding: 0 10px 0 0;
        margin-right: 4px;
        border-right: 1px solid var(--line);
        color: var(--fg);
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
        line-height: 30px;
      }
      .tagbg {
        fill: #0b1219ee;
        stroke: #4cc9f055;
      }
      .tagtx {
        fill: #e6edf5;
        font-weight: 600;
      }
      kbd.k {
        font: 600 10.5px/1 system-ui;
        padding: 2px 5px;
        border-radius: 5px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--mut);
      }
      #zoomctl {
        position: absolute;
        right: 12px;
        top: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #zoomctl .btn {
        width: 36px;
        height: 36px;
        padding: 0;
        font-size: 18px;
      }
      #zoomctl .btn.toggle.on {
        border-color: var(--acc);
        color: var(--acc);
      }
      aside {
        width: 320px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      aside:focus {
        outline: none;
      }
      #side {
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .sec {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .sec h3 {
        margin: 0 0 10px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--mut);
      }
      .lab {
        display: block;
        color: var(--mut);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .row label {
        color: var(--mut);
        width: 70px;
        flex: none;
      }
      .row .u {
        color: var(--mut);
      }
      input[type="text"],
      input[type="number"],
      input[type="search"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        outline: none;
      }
      input[type="text"]:focus,
      input[type="number"]:focus,
      input[type="search"]:focus {
        border-color: var(--acc);
        box-shadow: 0 0 0 2px #4cc9f044;
      }
      .list {
        flex: 1;
        overflow: auto;
        padding: 8px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 9px;
        cursor: pointer;
        border: 0;
        background: none;
        text-align: left;
      }
      .item:hover {
        background: var(--panel2);
      }
      .grp {
        margin-bottom: 4px;
      }
      .ghead {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        position: sticky;
        top: -8px;
        z-index: 1;
        padding: 7px 8px;
        border: 0;
        border-radius: 8px;
        background: var(--panel);
        color: var(--mut);
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: left;
      }
      .ghead:hover {
        color: var(--fg);
        background: var(--panel2);
      }
      .ghead .car {
        width: 10px;
      }
      .ghead .cnt {
        margin-left: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 10.5px;
      }
      .grp .item {
        padding-left: 30px;
      }
      .lfilter {
        padding: 0 12px 6px;
      }
      .lfilter input {
        padding: 6px 10px;
        font-size: 13px;
      }
      .item.sel {
        background: var(--panel2);
        outline: 1px solid var(--acc);
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        flex: none;
      }
      .item small {
        margin-left: auto;
        color: var(--mut);
      }
      .empty {
        color: var(--mut);
        text-align: center;
        padding: 24px 12px;
      }
      .seg {
        display: flex;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: none;
        padding: 6px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--mut);
        font-size: 12.5px;
      }
      .seg button:hover:not(.on) {
        color: var(--fg);
        background: var(--panel2);
      }
      .seg button.on {
        background: var(--panel2);
        color: var(--acc);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mut);
        cursor: pointer;
        margin: 6px 0;
      }
      .q {
        font-size: 12px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .qbig {
        font-size: 20px;
        font-weight: 700;
        margin: 6px 0 12px;
        outline: none;
      }
      .qbig b {
        color: var(--acc);
      }
      .quiz-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel2);
        cursor: pointer;
      }
      .quiz-toggle input {
        width: 18px;
        height: 18px;
        accent-color: var(--acc);
        flex: none;
      }
      .quiz-toggle span {
        display: grid;
        gap: 2px;
      }
      .quiz-toggle small {
        color: var(--mut);
        font-size: 12px;
      }
      .name-err {
        color: var(--bad);
        font-size: 12px;
        margin: -2px 0 6px;
      }
      .name-err:empty {
        display: none;
      }
      #nameInput[aria-invalid="true"] {
        border-color: var(--bad);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .chip {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--mut);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }
      .chip input {
        position: absolute;
        opacity: 0;
        inset: 0;
        margin: 0;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--acc);
      }
      .chip:has(input:checked) {
        background: rgba(76, 201, 240, 0.15);
        border-color: var(--acc);
        color: var(--text, #e6edf3);
      }
      .chip:has(input:checked)::before {
        content: "✓";
        color: var(--acc);
        font-weight: 800;
      }
      .chip:has(input:focus-visible) {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .chips.inline {
        flex-wrap: nowrap;
        gap: 3px;
      }
      .chips.inline .chip {
        flex: 1 1 auto;
        justify-content: center;
        padding: 5px 7px;
        gap: 3px;
        font-size: 12px;
        white-space: nowrap;
      }
      .quiz-answer-label {
        display: block;
        margin: 12px 0 5px;
        color: var(--mut);
        font-size: 12px;
      }
      .quiz-answer {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .quiz-answer input {
        min-width: 0;
      }
      .dim-x {
        align-self: center;
        color: var(--mut);
      }
      .quiz-answer .btn {
        flex: none;
      }
      .choices {
        display: grid;
        gap: 8px;
      }
      .choices button,
      .opts label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel2);
        cursor: pointer;
        text-align: left;
        font-weight: 600;
      }
      .choices button:hover:not(:disabled),
      .opts label:hover {
        border-color: var(--acc);
        background: #1d2836;
      }
      .choices button.ok,
      .opts label.ok {
        background: #10382c;
        border-color: var(--ok);
      }
      .choices button.bad,
      .opts label.bad {
        background: #3d1820;
        border-color: var(--bad);
      }
      .choices button:disabled {
        cursor: default;
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .opts input {
        width: 16px;
        height: 16px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 12.5px;
      }
      .chip:hover {
        border-color: var(--acc);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        text-align: center;
      }
      .stats div {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 4px;
      }
      .stats b {
        display: block;
        font-size: 20px;
      }
      .stats span {
        color: var(--mut);
        font-size: 11px;
      }
      .qfoot {
        padding: 4px 16px 14px;
      }
      .qfoot.stuck {
        position: sticky;
        bottom: 0;
        z-index: 5;
        padding-top: 8px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        box-shadow: 0 -8px 12px -6px rgba(0, 0, 0, 0.45);
      }
      .qfoot .fb {
        margin-top: 0;
      }
      .fb {
        min-height: 22px;
        margin-top: 10px;
        font-weight: 600;
      }
      .fb.ok {
        color: var(--ok);
      }
      .fb.bad {
        color: var(--bad);
      }
      .bar {
        height: 6px;
        background: var(--bg);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 12px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--acc), var(--acc2));
        transition: 0.3s;
      }
      .hidden {
        display: none !important;
      }
      body.viewer .edit-only,
      body.viewer [data-m="draw"],
      body.viewer #undo,
      body.viewer #redo,
      body.viewer #tools,
      body.viewer #zgrid,
      body.viewer #draftbar,
      #undo,
      #redo {
        display: none !important;
      }
      select {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 7px 10px;
        min-width: 130px;
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--mut);
        font-size: 12px;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .kb {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--mut);
        font-size: 11px;
        flex: none;
      }
      .muted {
        color: var(--mut);
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #050a10b3;
        backdrop-filter: blur(3px);
        display: grid;
        place-items: center;
        z-index: 50;
      }
      .modal form {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        width: min(420px, 92vw);
        max-height: 90vh;
        overflow: auto;
        box-shadow: 0 20px 60px #000a;
      }
      .modal h4 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .modal p {
        margin: 0 0 12px;
        color: var(--mut);
      }
      .modal p:empty,
      .modal .dbody:empty {
        display: none;
      }
      .modal .acts {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .modal table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 8px;
      }
      .modal td {
        padding: 3px 0;
        vertical-align: top;
      }
      .modal td:first-child {

  </head>
  <body>
    <a class="skip" href="#side">Skip to side panel</a>
    <header>
      <div class="hdr-left">
        <div class="brand"><i aria-hidden="true">✈</i> Aerodrome Trainer</div>
        <select id="mapSel" aria-label="Aerodrome"></select>
        <button class="btn edit-only" id="newMap" title="New aerodrome">

            <path
              d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12M10 11v6M14 11v6"

    <main>
      <div
        id="tools"

      ></div>
      <div id="stage">
        <svg
          id="map"

        ></svg>

          <span class="cnt" id="dcount"></span>
          <button

    <div id="live" class="sr" aria-live="polite" role="status"></div>

    <script>
      "use strict";
      const NS = "http://www.w3.org/2000/svg";
      const TYPES = {
        runway: { label: "Runway", color: "#3b4452", line: true, w: 34 },
        taxiway: { label: "Taxiway", color: "#d8b84a", line: true, w: 14 },
        apron: { label: "Apron", color: "#5b6b82", line: false },
        building: { label: "Building", color: "#7c5cff", line: false },
        point: { label: "Point", color: "#4cc9f0", line: false, pt: true },
      };
      const KEYS = {
        select: "V",
        runway: "R",
        taxiway: "T",
        apron: "A",
        building: "B",
        point: "P",
      };
      const ICONS = {
        select: '<path d="M5 3l14 8-6 2-3 6z" fill="currentColor"/>',
        runway:
          '<rect x="3" y="9" width="18" height="6" rx="1" fill="currentColor" opacity=".35"/><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>',
        taxiway:
          '<path d="M4 18l6-8 4 4 6-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
        apron:
          '<path d="M4 8l8-4 8 5-2 10-11 1z" fill="currentColor" opacity=".4" stroke="currentColor" stroke-width="1.5"/>',
        building:
          '<rect x="5" y="6" width="14" height="12" rx="2" fill="currentColor" opacity=".4" stroke="currentColor" stroke-width="1.5"/>',
        point:
          '<circle cx="12" cy="12" r="5" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>',
      };
      const HINTS = {
        select:
          "Click a shape to select · drag a white dot to reshape · drag a small ○ on an edge to add a bend · arrows nudge · Del removes",
        runway:
          "Click to add points · green rings = join an existing line · Backspace undoes the last point · Enter finishes · Alt = no snap",
        taxiway:
          "Click to add points · green rings = join an existing line · Backspace undoes the last point · Enter finishes · Alt = no snap",
        apron:
          "Click the corners · click the first point to close · Backspace undoes the last point · Enter finishes",
        building:
          "Click the corners · click the first point to close · Backspace undoes the last point · Enter finishes",
        point: "Click to drop a marker (gate, tower, hold point…)",
      };
      const QKINDS = {
        mixed: "Mixed (all types)",
        name: "What is this?",
        find: "Find it on the map",
        dims: "Runway dimensions",
        conn: "What connects to what?",
      };

      let S = { features: [] };
      let mode = "draw",
        tool = "select";
      let gridSnap = localStorage.getItem("aerodrome-grid") !== "0";
      let sel = null,
        selV = null,
        draft = null,
        cursor = null,
        kb = null,
        hover = null,
        labelsOn = true;
      let vb = { x: 0, y: 0, w: 1600, h: 1000 };
      const undoStack = [],
        redoStack = [];
      let quiz = null;
      let drag = null,
        panning = null,
        spaceDown = false,
        lastVtx = null;

      const $ = (id) => document.getElementById(id);
      const svg = $("map");
      const uid = () => Math.random().toString(36).slice(2, 9);
      const byId = (id) => S.features.find((f) => f.id === id);
      const isLine = (f) => TYPES[f.type].line;
      const named = (f) => f.type !== "apron" && !!(f.name && f.name.trim());
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const el = (n, a = {}, p) => {
        const e = document.createElementNS(NS, n);
        for (const k in a) e.setAttribute(k, a[k]);
        if (p) p.appendChild(e);
        return e;
      };
      let liveT = null;
      function announce(t) {
        clearTimeout(liveT);
        $("live").textContent = "";
        liveT = setTimeout(() => ($("live").textContent = t), 60);
      }

      /* ---------- maps: stored as maps/<name>.json ---------- */
      let EDIT = false,
        curMap = null,
        mapNames = [],
        saveTimer = null;
      const LAST = "aerodrome-last-map";
      function setStatus(t, color) {
        const s = $("status");
        s.className = "pill";
        s.style.setProperty("--c", color || "var(--mut)");
        s.innerHTML = "<i></i><b></b>";
        s.lastChild.textContent = t
          .replace(/^[✓✗]\s*/, "")
          .replace(/^Auto-saves to .*/, "Auto-save on")
          .replace(/^Saved to .*/, "Saved")
          .replace(/^Save failed.*/, "Save failed");
        s.title = t.replace(/^[✓✗]\s*/, "");
      }
      function save() {
        if (!EDIT || !curMap) return;
        clearTimeout(saveTimer);
        setStatus("Saving…", "#fbbf24");
        saveTimer = setTimeout(async () => {
          try {
            const r = await fetch("/api/maps/" + encodeURIComponent(curMap), {
              method: "PUT",
              body: JSON.stringify(S),
            });
            if (!r.ok) throw 0;
            setStatus("✓ Saved to maps/" + curMap + ".json", "#34d399");
          } catch (e) {
            setStatus("✗ Save failed – is server.py running?", "#fb7185");
          }
        }, 300);
      }
      async function fetchNames() {
        const r = await fetch(EDIT ? "/api/maps" : "maps/index.json", {
          cache: "no-store",
        });
        mapNames = r.ok ? await r.json() : [];
      }
      function fillMapSelect() {
        const s = $("mapSel");
        s.innerHTML =
          mapNames
            .map((n) => `<option value="${esc(n)}">${esc(n)}</option>`)
            .join("") || '<option value="">(no maps)</option>';
        if (curMap) s.value = curMap;
      }
      async function openMap(name) {
        clearTimeout(saveTimer);
        curMap = name;
        sel = selV = null;
        quiz = null;
        draft = null;
        undoStack.length = redoStack.length = 0;
        try {
          const r = await fetch("maps/" + encodeURIComponent(name) + ".json", {
            cache: "no-store",
          });
          const d = r.ok ? await r.json() : null;
          S = d && Array.isArray(d.features) ? d : { features: [] };
        } catch (e) {
          S = { features: [] };
        }
        localStorage.setItem(LAST, name);
        fillMapSelect();
        fit();
        renderSide();
        if (EDIT)
          setStatus("✓ Auto-saves to maps/" + name + ".json", "#34d399");
      }
      async function initMaps() {
        try {
          EDIT = (await fetch("/api/ping", { cache: "no-store" })).ok;
        } catch (e) {
          EDIT = false;
        }
        EDIT =
          EDIT &&
          ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
        document.body.classList.toggle("viewer", !EDIT);
        if (!EDIT) setMode("study");
        try {
          await fetchNames();
        } catch (e) {
          mapNames = [];
        }
        const last = localStorage.getItem(LAST);
        if (mapNames.length)
          await openMap(mapNames.includes(last) ? last : mapNames[0]);
        else {
          fillMapSelect();
          if (EDIT) await newMap("My Airport");
          else setStatus("No maps published yet");
        }
        renderTools();
        renderSide();
        updateHint();
      }
      function dialog({
        title,
        text,
        input,
        ok = "OK",
        danger,
        html,
        cancel = true,
      }) {
        return new Promise((res) => {
          const prev = document.activeElement;
          const o = document.createElement("div");
          o.className = "modal";
          o.innerHTML = `<form role="dialog" aria-modal="true" aria-labelledby="dlgT"><h4 id="dlgT"></h4><p></p><div class="dbody"></div>${input !== undefined ? '<input type="text" maxlength="60" autocomplete="off" aria-labelledby="dlgT">' : ""}<div class="acts">${cancel ? '<button type="button" class="btn" data-x>Cancel</button>' : ""}<button type="submit" class="btn ${danger ? "danger solid" : "primary"}"></button></div></form>`;
          o.querySelector("h4").textContent = title;
          o.querySelector("p").textContent = text || "";
          if (html) o.querySelector(".dbody").innerHTML = html;
          o.querySelector("[type=submit]").textContent = ok;
          const inp = o.querySelector("input");
          if (inp) inp.value = input;
          const close = (v) => {
            o.remove();
            if (prev && prev.focus) prev.focus();
            res(v);
          };
          const x = o.querySelector("[data-x]");
          if (x) x.onclick = () => close(null);
          o.onmousedown = (e) => {
            if (e.target === o) close(cancel ? null : true);
          };
          o.onkeydown = (e) => {
            if (e.key === "Escape") close(cancel ? null : true);
            if (e.key === "Tab") {
              const f = [...o.querySelectorAll("input,button")].filter(
                (n) => !n.disabled,
              );
              const first = f[0],
                last = f[f.length - 1];
              if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
              } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
            e.stopPropagation();
          };
          o.querySelector("form").onsubmit = (e) => {
            e.preventDefault();
            close(inp ? inp.value : true);
          };
          document.body.appendChild(o);
          (inp || o.querySelector("[type=submit]")).focus();
          if (inp) inp.select();
        });
      }
      const cleanName = (n) =>
        (n || "")
          .trim()
          .replace(/[^\w \-.]/g, "")
          .slice(0, 60);
      async function newMap(preset) {
        let n = preset;
        for (;;) {
          if (!preset) {
            n = await dialog({
              title: "New aerodrome",
              text: "Name it, e.g. YSSY",
              input: "",
              ok: "Create",
            });
            if (n === null) return;
          }
          n = cleanName(n);
          if (!n) {
            if (preset) return;
            continue;
          }
          if (!mapNames.includes(n)) break;
          if (preset) return;
          await dialog({
            title: "Name already used",
            text: `"${n}" already exists.`,
            cancel: false,
          });
        }
        const r = await fetch("/api/maps/" + encodeURIComponent(n), {
          method: "PUT",
          body: JSON.stringify({ features: [] }),
        });
        if (!r.ok) {
          await dialog({
            title: "Error",
            text: "Could not create map.",
            cancel: false,
          });
          return;
        }
        await fetchNames();
        await openMap(n);
      }
      async function renameMap() {
        if (!curMap) return;
        let n = curMap;
        for (;;) {
          n = await dialog({
            title: "Rename aerodrome",
            input: n,
            ok: "Rename",
          });
          if (n === null) return;
          n = cleanName(n);
          if (!n || n === curMap) return;
          if (!mapNames.includes(n)) break;
          await dialog({
            title: "Name already used",
            text: `"${n}" already exists.`,
            cancel: false,
          });
        }
        const r = await fetch("/api/rename/" + encodeURIComponent(curMap), {
          method: "POST",
          body: JSON.stringify({ to: n }),
        });
        if (!r.ok) {
          await dialog({
            title: "Error",
            text: "Could not rename map.",
            cancel: false,
          });
          return;
        }
        await fetchNames();
        await openMap(n);
      }
      async function deleteMap() {
        if (!curMap) return;
        const ok = await dialog({
          title: `Delete "${curMap}"?`,
          text: `This permanently removes maps/${curMap}.json.`,
          ok: "Delete",
          danger: true,
        });
        if (!ok) return;
        await fetch("/api/maps/" + encodeURIComponent(curMap), {
          method: "DELETE",
        });
        await fetchNames();
        if (mapNames.length) await openMap(mapNames[0]);
        else {
          S = { features: [] };
          curMap = null;
          await newMap("My Airport");
        }
      }

      /* ---------- undo / redo ---------- */
      function snap() {
        undoStack.push(JSON.stringify(S));
        if (undoStack.length > 100) undoStack.shift();
        redoStack.length = 0;
      }
      function commit() {
        save();
        render();
        renderSide();
      }
      function undo() {
        if (draft) {
          if (draft.pts.length > 1) draft.pts.pop();
          else draft = null;
          updateHint();
          render();
          return;
        }
        const s = undoStack.pop();
        if (!s) return;
        redoStack.push(JSON.stringify(S));
        S = JSON.parse(s);
        if (!byId(sel)) sel = selV = null;
        commit();
        announce("Undone");
      }
      function redo() {
        const s = redoStack.pop();
        if (!s) return;
        undoStack.push(JSON.stringify(S));
        S = JSON.parse(s);
        if (!byId(sel)) sel = selV = null;
        commit();
        announce("Redone");
      }

      /* ---------- geometry ---------- */
      function scale() {
        const r = svg.getBoundingClientRect();
        return Math.min(r.width / vb.w, r.height / vb.h) || 1;
      }
      function toWorld(ev) {
        const r = svg.getBoundingClientRect();
        const s = scale();
        const ox = (r.width - vb.w * s) / 2,
          oy = (r.height - vb.h * s) / 2;
        return {
          x: vb.x + (ev.clientX - r.left - ox) / s,
          y: vb.y + (ev.clientY - r.top - oy) / s,
        };
      }
      const GSTEPS = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
      function gridStep() {
        const s = scale();
        return GSTEPS.find((g) => g * s >= 16) || GSTEPS[GSTEPS.length - 1];
      }
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      function projSeg(p, a, b) {
        const dx = b.x - a.x,
          dy = b.y - a.y,
          l = dx * dx + dy * dy;
        let t = l ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l : 0;
        t = Math.max(0, Math.min(1, t));
        return { x: a.x + t * dx, y: a.y + t * dy };
      }
      function nearPoly(p, pts) {
        let best = { d: dist(p, pts[0]), q: pts[0] };

      }
      function constrain(a, w) {

          Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);

        if (best) return best;

            dx: Math.round((orig[0].x + dx) / g) * g - orig[0].x,

      }
      function centroid(f) {

          let h = tot / 2;
          for (let i = 0; i < f.pts.length - 1; i++) {

            if (h <= d) {

                a = f.pts[i],
                b = f.pts[i + 1];

      const ptsStr = (pts) => pts.map((p) => p.x + "," + p.y).join(" ");

      // Runway designators placed at the correct physical ends (e.g. 09/27 -> 09 at the west end).
      function runwayEnds(f) {
        if (f.type !== "runway" || f.pts.length < 2 || !f.name) return null;
        const m = f.name
          .split("/")
          .map((x) => x.trim())
          .filter(Boolean);
        if (m.length !== 2) return null;
        const nums = m.map((x) => parseInt(x, 10));
        if (nums.some((n) => !(n >= 1 && n <= 36))) return null;
        const a = f.pts[0],
          b = f.pts[f.pts.length - 1];
        const brg =
          ((Math.atan2(b.x - a.x, -(b.y - a.y)) * 180) / Math.PI + 360) % 360;
        const dd = (n) => {
          const d = Math.abs(n * 10 - brg) % 360;
          return Math.min(d, 360 - d);
        };
        const first = dd(nums[0]) <= dd(nums[1]) ? 0 : 1;
        return [
          { label: m[first], pt: a, toward: f.pts[1], idx: 0 },
          {
            label: m[1 - first],
            pt: b,
            toward: f.pts[f.pts.length - 2],
            idx: 1,
          },
        ];
      }

      /* ---------- rendering ---------- */
      function drawFeature(f, g, k) {
        const T = TYPES[f.type],
          d = ptsStr(f.pts),
          attr = { "data-id": f.id };
        if (T.pt) {
          el(
            "circle",
            {
              cx: f.pts[0].x,
              cy: f.pts[0].y,
              r: 4.5 * k,
              fill: T.color,
              stroke: "#fff",
              "stroke-width": 1.5 * k,
              ...attr,
            },
            g,
          );
          el(
            "circle",
            {
              cx: f.pts[0].x,
              cy: f.pts[0].y,
              r: 14 * k,
              fill: "transparent",
              ...attr,
            },
            g,
          );
        } else if (T.line) {
          const base = {
            points: d,
            fill: "none",
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
            ...attr,
          };

            "polyline",
            {

              "polyline",

            "polyline",

      const findable = (id) => {

              el(
                "circle",
                {
                  cx: q.x,
                  cy: q.y,

                  fill: "#34d399",
                  "pointer-events": "none",

        if (f) {

              if (dist(a, b) * s < 28) continue;

                "circle",
                {
                  cx: mp.x,
                  cy: mp.y,

                  fill: "#0b1016",
                  stroke: "#4cc9f0",

                },

              );

                "path",
                {

                  stroke: "#4cc9f0",
                  "stroke-width": 1.2 * k,
                  "pointer-events": "none",
                },

            }
            f.pts.forEach((p, i) =>
              el(
                "circle",
                {
                  cx: p.x,

                  fill: i === selV ? "#4cc9f0" : "#fff",
                  stroke: "#4cc9f0",
                  "stroke-width": 2 * k,
                  "data-h": i,
                  style: "cursor:grab",
                },
                gUI,
              ),
            );
          }
          if (n > 1) {
            const b = bbox(f.pts),

            el(
              "rect",
              {
                x: b.minx,

            );
            el(
              "line",

      /* ---------- quiz engine ---------- */

      function startQuiz() {

                  quiz.checked = new Set(o.right);
                  quiz.showIds = new Set(o.right);
                }
              }
              renderSide();
              render();
            }),
        );
        if (quiz && quiz.focus) {
          const t = quiz.focus;
          quiz.focus = null;
          const target =
            t === "next"
              ? $("qnext")
              : $("qhead") ||
                ($("typed") && !window.matchMedia("(pointer: coarse)").matches
                  ? $("typed")
                  : null);
          if (target) target.focus({ preventScroll: true });
          // Focusing the input on touch devices opens the keyboard and scrolls away from the map
          const coarse = window.matchMedia("(pointer: coarse)").matches;
          if (t === "first" && $("typed") && !coarse) $("typed").focus();
        }
      }

      /* ---------- modes ---------- */
      function setMode(m) {
        cancelDraft();
        mode = m;
        sel = selV = hover = cursor = kb = null;
        document.querySelectorAll("#tabs button").forEach((x) => {
          const on = x.dataset.m === m;
          x.classList.toggle("on", on);
          x.setAttribute("aria-selected", on);
          x.tabIndex = on ? 0 : -1;
        });
        $("tools").classList.toggle("hidden", m !== "draw");
        $("undo").classList.toggle("hidden", m !== "draw");
        $("redo").classList.toggle("hidden", m !== "draw");
        if (m === "quiz") quiz = null;
        svg.style.cursor =
          m === "draw" ? (tool === "select" ? "" : "crosshair") : "grab";
        renderSide();
        render();
        updateHint();
        announce(`${m[0].toUpperCase() + m.slice(1)} mode`);
      }
      const tabBtns = () => [...document.querySelectorAll("#tabs button")];
      tabBtns().forEach((b) => {
        b.onclick = () => setMode(b.dataset.m);
        b.onkeydown = (e) => {
          const v = tabBtns().filter((x) => x.offsetParent);
          let i = v.indexOf(b);
          if (e.key === "ArrowRight") i = (i + 1) % v.length;
          else if (e.key === "ArrowLeft") i = (i - 1 + v.length) % v.length;
          else if (e.key === "Home") i = 0;
          else if (e.key === "End") i = v.length - 1;
          else return;
          e.preventDefault();
          v[i].focus();
          setMode(v[i].dataset.m);
        };
      });

      addEventListener("resize", () => render());
      renderTools();
      renderSide();
      updateHint();
      requestAnimationFrame(fit);
      initMaps();
    </script>
  </body>
</html>
